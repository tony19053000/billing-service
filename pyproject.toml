[project]
name = "billing-service"
version = "1.0.0"
description = "Tallyo subscription billing platform and customer billing portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
