{% extends "base.html" %}

{% block title %}Page Not Found (404) — Tallyo{% endblock %}

{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div style="text-align: center; max-width: 480px;">
    <div style="font-family: var(--font-mono); font-size: 54px; font-weight: 700; color: var(--primary); margin-bottom: 8px;">404</div>
    <h1 style="font-size: 24px; margin-bottom: 12px;">Resource not found</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">
      The requested route or billing entity does not exist or has been moved to another location.
    </p>
    <div style="display: flex; justify-content: center; gap: 12px;">
      <a href="/app" class="btn btn-primary">Go to Dashboard</a>
      <a href="/" class="btn btn-secondary">Platform Home</a>
    </div>
  </div>
</div>
{% endblock %}
